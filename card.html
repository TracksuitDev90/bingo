<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Your Card · Fireside Bingo</title>
    <meta
      name="description"
      content="Your own one-of-a-kind Fireside Bingo card. Daub the numbers as they're called."
    />
    <meta name="theme-color" content="#173f66" />
    <link rel="icon" href="assets/img/favicon.svg?v=f4fec49b" type="image/svg+xml" />
    <link rel="preload" href="assets/fonts/titan-one.woff2?v=56655764" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/itim.woff2?v=81ac40e9" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/fraunces-italic.woff2?v=1458807e" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/img/paper.jpg?v=b0165fd7" as="image" />
    <link rel="stylesheet" href="css/base.css?v=8126ec55" />
    <link rel="stylesheet" href="css/cardview.css?v=78628ecb" />
    <link rel="stylesheet" href="css/card.css?v=e6645c6a" />
  </head>
  <body class="table card-page">
    <header class="topbar">
      <div class="topbar__left">
        <a class="tag" href="./" aria-label="Home"
          ><span aria-hidden="true">←</span><span class="tag__text">Home</span></a
        >
        <p class="brand"><span class="brand__fire">Fireside</span><span class="brand__bingo">bingo</span></p>
      </div>
      <p class="hint" id="hint">tap a number to daub it</p>
      <button class="icon-btn" id="sound" type="button" aria-pressed="true" aria-label="Sound effects">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9h4l5-4v14l-5-4H4z" />
          <path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" />
        </svg>
      </button>
    </header>

    <main class="desk">
      <div class="stage" id="stage"></div>

      <section class="tray" id="tray" aria-label="Choose your dauber">
        <div class="tray__bottles" id="bottles" role="radiogroup" aria-label="Dauber colour"></div>
        <p class="tray__name" id="dauber-name"></p>
      </section>

      <section class="shared" id="shared" hidden>
        <p class="shared__title">Shared card</p>
        <p class="shared__meta" id="shared-meta"></p>
        <a class="btn btn--gold" id="shared-check" href="blower.html">Check it on my blower</a>
        <a class="btn btn--small btn--ghost" href="card.html">Get my own card</a>
      </section>
    </main>

    <footer class="actions" id="actions">
      <button class="btn btn--small btn--ghost" id="new-card" type="button">New card</button>
      <button class="btn btn--gold btn--bingo" id="bingo" type="button">BINGO!</button>
      <button class="btn btn--small btn--ghost" id="wipe" type="button">Wipe daubs</button>
    </footer>

    <dialog class="sheet" id="share-sheet" aria-labelledby="share-title">
      <form method="dialog" class="sheet__body">
        <button class="sheet__close" value="close" aria-label="Close">×</button>
        <h2 id="share-title">Call it in!</h2>
        <p>
          Send this link to your caller. It carries your card and every daub, sealed so nobody can read or change it.
          They paste it into the blower to check your bingo.
        </p>
        <div class="field">
          <input id="share-url" readonly aria-label="Your sealed card link" />
          <button type="button" class="btn btn--ink" id="copy">Copy</button>
        </div>
        <p class="share__note" id="share-note"></p>
        <div class="sheet__actions">
          <button type="button" class="btn btn--small" id="native-share" hidden>Share…</button>
          <button class="btn btn--small btn--gold" value="close">Done</button>
        </div>
      </form>
    </dialog>

    <script>
      // If the game's scripts can't start, or the browser mixed old and new
      // copies of the site's files after an update (two versions of one file),
      // say so and offer a reload that first fetches fresh copies of them all.
      addEventListener('load', function () {
        setTimeout(function () {
          var files = performance
            .getEntriesByType('resource')
            .map(function (e) {
              return new URL(e.name);
            })
            .filter(function (u) {
              return u.origin === location.origin;
            });
          var seen = {};
          var mixed = files.some(function (u) {
            var v = u.searchParams.get('v');
            var before = seen[u.pathname];
            if (v) seen[u.pathname] = v;
            return !!v && !!before && before !== v;
          });
          if (document.documentElement.hasAttribute('data-ready') && !mixed) return;
          var p = document.createElement('p');
          p.id = 'load-fail';
          p.setAttribute('role', 'alert');
          p.style.cssText =
            'position:fixed;left:50%;top:50%;z-index:99;transform:translate(-50%,-50%);width:min(320px,calc(100vw - 32px));margin:0;padding:18px 20px;border-radius:14px;background:#fff;color:#1d2230;font:600 1rem/1.4 system-ui,sans-serif;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)';
          p.innerHTML =
            'The game didn’t load properly.<br><button type="button" style="margin-top:12px;padding:10px 22px;border:0;border-radius:999px;background:#f0b429;color:#1d2230;outline-color:#1d2230;font:inherit">Reload</button>';
          p.querySelector('button').onclick = function () {
            this.disabled = true;
            // A plain reload can keep reusing the stale cached copies.
            var fresh = window.fetch
              ? Promise.all(
                  files.map(function (u) {
                    return fetch(u.href, { cache: 'reload' }).catch(function () {});
                  }),
                )
              : Promise.resolve();
            fresh.then(function () {
              location.reload();
            });
          };
          document.body.appendChild(p);
        }, 800);
      });
    </script>
    <script type="module" src="js/card-page.js?v=f081c89f"></script>
  </body>
</html>
